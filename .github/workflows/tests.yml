name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries
        # PySide6 휠은 libEGL 등을 들고 오지 않는다. 없으면 QtWidgets import가
        # 실패해 GUI 테스트가 통째로 건너뛰어진다.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" seaborn pandas
      - name: Run tests
        # Qt는 화면 없이 돌려야 한다. 플랫폼 플러그인이 없으면 GUI 테스트는
        # 스스로 건너뛴다 (tests/test_direct.py의 qapp fixture).
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
